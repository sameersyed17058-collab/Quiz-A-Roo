<!-- Bottom Nav Bar (Suppressed on active quiz, but keeping structure per instructions if it were a top-level dest, though logic dictates suppression here. I will omit it to prioritize the canvas as per "Automatic Suppression" rule for transactional/focused tasks.) -->
<script>
        // Simple timer logic for demonstration
        let timeLeft = 15;
        const timerElement = document.getElementById('timer-text');
        
        const countdown = setInterval(() => {
            timeLeft--;
            const formattedTime = `00:${timeLeft.toString().padStart(2, '0')}`;
            if(timerElement) timerElement.textContent = formattedTime;
            
            if (timeLeft <= 5 && timerElement) {
                timerElement.parentElement.classList.add('text-error');
                timerElement.parentElement.classList.remove('text-primary');
            }
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                // Handle timeout
            }
        }, 1000);

        // Add interaction to buttons
        const answerButtons = document.querySelectorAll('.answer-btn');
        answerButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove selected state from others
                answerButtons.forEach(b => {
                    b.classList.remove('border-primary', 'bg-primary-container/10');
                    b.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                    const letterSpan = b.querySelector('span.rounded-full');
                    if(letterSpan) {
                         letterSpan.classList.remove('bg-primary', 'text-on-primary');
                         letterSpan.classList.add('bg-surface-container-low', 'text-on-surface-variant');
                    }
                });

                // Add selected state to clicked
                this.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                this.classList.add('border-primary', 'bg-primary-container/10', 'border-[3px]');
                
                const letterSpan = this.querySelector('span.rounded-full');
                if(letterSpan) {
                     letterSpan.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
                     letterSpan.classList.add('bg-primary', 'text-on-primary');
                }
                
                // Simulate moving to next step after brief delay
                setTimeout(() => {
                    // Logic to proceed
                }, 800);
            });
        });
    </script>
