<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quiz-a-roo - Select Difficulty</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "primary-container": "#b15f00",
                        "outline": "#887364",
                        "inverse-primary": "#ffb77d",
                        "secondary-fixed": "#ffdbcc",
                        "secondary-container": "#fd9e70",
                        "primary": "#8d4b00",

                        "tertiary-fixed-dim": "#d1c79d",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#b5ac84",
                        "on-error": "#ffffff",
                        "on-primary-container": "#fffbff",
                        "surface-dim": "#dadad9",
                        "on-tertiary-fixed-variant": "#4d4727",
                        "surface-variant": "#e3e2e1",
                        "on-tertiary-fixed": "#201c02",
                        "surface-container-highest": "#e3e2e1",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#ffb77d",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#76340e",
                        "background": "#faf9f8",
                        "on-secondary-fixed-variant": "#76330d",
                        "primary-fixed": "#ffdcc3",
                        "inverse-surface": "#2f3130",
                        "surface": "#faf9f8",
                        "on-primary-fixed-variant": "#6e3900",
                        "on-secondary": "#ffffff",
                        "on-tertiary-container": "#464021",
                        "secondary-fixed-dim": "#ffb693",
                        "secondary": "#944a23",

                        "difficulty-easy": "#4ade80",
                        "difficulty-medium": "#facc15",
                        "difficulty-hard": "#f87171"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "md": "24px",
                        "margin-desktop": "64px",
                        "gutter": "20px",

                        "xl": "80px",
                        "base": "8px"
                    },
                    "fontFamily": {

<style>
        body { background-color: #FDFCFB; }
        .card-shadow { box-shadow: 0 4px 20px rgba(141, 75, 0, 0.05); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar -->
<header class="bg-background flex justify-between items-center px-margin-mobile h-16 w-full docked full-width top-0 z-10 sticky">
<div class="flex items-center gap-sm">
<button class="text-primary hover:opacity-80 transition-opacity scale-95 active:transition-transform duration-100 p-2 rounded-full hover:bg-surface-variant/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tight">Quiz-a-roo</h1>
</div>
<div class="flex items-center gap-xs">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity p-2 rounded-full hover:bg-surface-variant/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity p-2 rounded-full hover:bg-surface-variant/20">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">leaderboard</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop py-md md:py-lg max-w-[1200px] mx-auto w-full mb-20 md:mb-0">
<!-- Breadcrumbs -->
<nav class="flex items-center gap-2 text-label-md font-label-md text-on-surface-variant mb-md overflow-x-auto whitespace-nowrap hide-scrollbar">
<a class="hover:text-primary transition-colors" href="#">Categories</a>
<span class="material-symbols-outlined text-sm">chevron_right</span>
<a class="hover:text-primary transition-colors" href="#">Science &amp; Nature</a>
<span class="material-symbols-outlined text-sm">chevron_right</span>
<span class="text-primary font-bold">Select Difficulty</span>
</nav>
<header class="mb-lg text-center md:text-left">
<h2 class="font-headline-xl text-headline-xl text-primary mb-sm">Choose Your Challenge</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl">Select a difficulty level to begin. Higher difficulties reward more XP but are significantly harder.</p>
</header>
<!-- Bento Grid for Difficulty Cards -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter auto-rows-fr">
<!-- Easy Card -->
<button class="group relative bg-[#FEF3C7] rounded-xl p-md flex flex-col h-full card-shadow hover:shadow-lg transition-all duration-300 hover:-translate-y-1 text-left focus:outline-none focus:ring-4 focus:ring-primary/20 border-2 border-transparent hover:border-difficulty-easy/50">
<div class="flex justify-between items-start mb-lg w-full">
<div class="w-12 h-12 rounded-full bg-difficulty-easy/20 flex items-center justify-center text-difficulty-easy">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">sentiment_satisfied</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant px-3 py-1 bg-surface rounded-full shadow-sm">1x XP</span>
</div>
<div class="mt-auto">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xs group-hover:text-difficulty-easy transition-colors">Easy</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Gentle questions to warm up your brain. Great for casual play.</p>
</div>
<!-- Selection Indicator Overlay -->
<div class="absolute inset-0 rounded-xl border-2 border-difficulty-easy opacity-0 group-focus:opacity-100 pointer-events-none transition-opacity"></div>
</button>
<!-- Medium Card -->
<button class="group relative bg-[#FEF3C7] rounded-xl p-md flex flex-col h-full card-shadow hover:shadow-lg transition-all duration-300 hover:-translate-y-1 text-left focus:outline-none focus:ring-4 focus:ring-primary/20 border-2 border-transparent hover:border-difficulty-medium/50">
<div class="flex justify-between items-start mb-lg w-full">
<div class="w-12 h-12 rounded-full bg-difficulty-medium/20 flex items-center justify-center text-difficulty-medium">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">psychology</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant px-3 py-1 bg-surface rounded-full shadow-sm flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-difficulty-medium" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
                        1.5x XP
                    </span>
</div>
<div class="mt-auto">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xs group-hover:text-difficulty-medium transition-colors">Medium</h3>
<p class="font-body-md text-body-md text-on-surface-variant">A balanced challenge that will test your knowledge without breaking a sweat.</p>
</div>
<!-- Selection Indicator Overlay -->
<div class="absolute inset-0 rounded-xl border-2 border-difficulty-medium opacity-0 group-focus:opacity-100 pointer-events-none transition-opacity"></div>
</button>
<!-- Hard Card -->
<button class="group relative bg-[#FEF3C7] rounded-xl p-md flex flex-col h-full card-shadow hover:shadow-lg transition-all duration-300 hover:-translate-y-1 text-left focus:outline-none focus:ring-4 focus:ring-primary/20 border-2 border-transparent hover:border-difficulty-hard/50">
<div class="flex justify-between items-start mb-lg w-full">
<div class="w-12 h-12 rounded-full bg-difficulty-hard/20 flex items-center justify-center text-difficulty-hard">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant px-3 py-1 bg-surface rounded-full shadow-sm flex items-center gap-1">
<span class="material-symbols-outlined text-sm text-difficulty-hard" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
                        2x XP
                    </span>
</div>
<div class="mt-auto">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xs group-hover:text-difficulty-hard transition-colors">Hard</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Tough questions for experts. High risk, high reward.</p>
</div>
<!-- Selection Indicator Overlay -->
<div class="absolute inset-0 rounded-xl border-2 border-difficulty-hard opacity-0 group-focus:opacity-100 pointer-events-none transition-opacity"></div>
</button>
</div>
<div class="mt-lg flex justify-center md:justify-end">
<button class="bg-primary text-on-primary font-label-md text-label-md px-xl py-sm rounded-full shadow-md hover:bg-primary/90 transition-colors flex items-center gap-2 scale-95 active:scale-90 duration-100 w-full md:w-auto justify-center">
                Start Quiz
                <span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
</main>
<!-- BottomNavBar (Hidden on md and up) -->
<nav class="md:hidden bg-surface-container-lowest dark:bg-surface-container-low shadow-sm fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-colors rounded-full p-2 w-16">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 hover:bg-primary-container/90 transition-colors w-16">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">category</span>
<span class="font-label-sm text-label-sm">Categories</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-colors rounded-full p-2 w-16">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">military_tech</span>
<span class="font-label-sm text-label-sm">Leaders</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/50 transition-colors rounded-full p-2 w-16">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 0;">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
</body></html>
