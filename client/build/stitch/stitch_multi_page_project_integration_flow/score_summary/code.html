<style>
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 20px;
            background-color: #8d4b00;
            opacity: 0;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        .pulse-shadow {
            animation: pulse-shadow 2s infinite;
        }
        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(141, 75, 0, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(141, 75, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(141, 75, 0, 0); }
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased relative overflow-hidden">
<!-- Confetti Container -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<!-- Top Navigation (Shell suppressed as this is a linear flow/success screen, but keeping top bar for app consistency as per standard practice, though prompt implies a specific destination logic, we'll follow standard app flow which often keeps top app bar for navigation back. Actually, "Task-Focused: Any sub-page featuring a 'Close' or 'Back' action that implies a temporary departure from the main navigation flow. Automatic Suppression: You MUST exclude the navigation shell if the page intent is: Linear/Transactional: Login, Sign-up, Onboarding, Checkout, or "Success/Confirmation" splash screens." - So NO NAV SHELLS.) -->
<!-- We will use a minimal custom header instead of the shared TopAppBar to adhere to suppression rules while providing a way out -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full z-10 relative bg-transparent">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">close</span>
</button>
<span class="font-headline-md text-headline-md-mobile text-primary">Quiz-a-roo</span>
<div class="w-10 h-10"></div> <!-- Spacer -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile z-10 relative">
<div class="w-full max-w-lg">
<!-- Results Card -->
<div class="bg-[#FEF3C7] rounded-xl p-md md:p-lg flex flex-col items-center text-center relative" style="box-shadow: 0px 4px 20px rgba(47, 21, 0, 0.05);">
<!-- Celebration Icon/Image Placeholder -->
<div class="w-32 h-32 mb-6 rounded-full bg-surface-container overflow-hidden pulse-shadow relative flex items-center justify-center border-4 border-primary">
<img class="w-full h-full object-cover" data-alt="A stylized 3D illustration of a golden trophy cup with glowing particles around it, sitting on a soft cream background. The mood is celebratory and victorious, designed in a casual, warm tactile modernism style with earthy orange accents." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_qY4tFgj_CrYmJkKxSFk6f9NUycFTpSjSBpQBxrKYMBORMoZGHqLhw5nijh0SYYcM_oWUCNmA17dG8e7aRK2_vi0hksnJrlGgFaX3YJIV0v8Xf-VeeLNjmYzFBrpr7m74JHq60Afb5VlqJ6kqTVaZ1rauIdYogpen9ieouLbOeJyvCZG9Tu2W0mjZ0l7yCSmKK0exTnllYX4vFm3YaJZNTRKyn-wg7uIHmad14PMZBJYigHKXRy0w8g"/>
<!-- Fallback Icon if image fails -->
<span class="material-symbols-outlined text-6xl text-primary absolute opacity-0">emoji_events</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary mb-2">Spectacular!</h1>
<p class="font-body-lg text-on-surface-variant mb-8 max-w-sm">You've successfully completed the 'History Trivia' challenge.</p>
<!-- Stats Grid (Bento Style) -->
<div class="grid grid-cols-2 gap-4 w-full mb-8">
<!-- Total Score -->
<div class="bg-surface rounded-lg p-sm flex flex-col items-center justify-center border border-outline-variant shadow-sm col-span-2">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Total Score</span>
<div class="flex items-baseline gap-1">
<span class="font-headline-lg text-headline-lg text-secondary">2,450</span>
<span class="font-label-md text-label-md text-on-surface-variant">pts</span>
</div>
</div>
<!-- Accuracy -->
<div class="bg-surface rounded-lg p-sm flex flex-col items-center justify-center border border-outline-variant shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Accuracy</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-md text-headline-md text-on-surface">90%</span>
</div>
</div>
<!-- XP Earned -->
<div class="bg-surface rounded-lg p-sm flex flex-col items-center justify-center border border-outline-variant shadow-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">XP Earned</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-headline-md text-headline-md text-on-surface">+450</span>
</div>
</div>
</div>

<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-full font-label-md text-label-md shadow-sm hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">replay</span>
                        Play Again
                    </button>
<button class="w-full bg-transparent border-2 border-secondary text-secondary py-3 px-6 rounded-full font-label-md text-label-md hover:bg-secondary-fixed/20 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined">leaderboard</span>
                        View Leaderboard
                    </button>
</div>
</div>
</div>
</main>
<script>
        // Simple confetti effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#8d4b00', '#944a23', '#fd9e70', '#ffb77d'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                // Randomize
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                
                container.appendChild(confetti);
            }
        });
    </script>
</body></html>
